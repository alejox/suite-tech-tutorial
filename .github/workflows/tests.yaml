name: Unit tests
run-name: ${{ github.ref_name }} unit tests 🧪
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: Core logic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build-tests
      - name: Build
        run: cmake --build build-tests --config Release
      - name: Test
        run: ctest --test-dir build-tests -C Release --output-on-failure

  overlay:
    name: Vue overlay
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Built overlay is up to date
        run: |
          npm run build
          git diff --exit-code -- ../data/overlay || (echo "::error::Run 'npm run build' in overlay/ and commit data/overlay" && exit 1)
